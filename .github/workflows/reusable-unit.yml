name: Unit testing
on:
  workflow_call:
    inputs:
      php:
        type: string
        required: true
      coverage:
        type: boolean
        required: false
        default: false
      os:
        description: 'Runner to use. Defaults to ubuntu-22.04, or the RUNNERS_NAME repository variable when set.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unit:
    # This name has to stand on its own. The run view labels a nested job with its
    # own name only; the calling job's name is not surfaced at this depth, so
    # anything omitted here is not shown anywhere.
    name: Unit | PHP ${{ inputs.php }}${{ inputs.coverage && ' (with coverage)' || '' }}${{ startsWith( inputs.os, 'windows' ) && ' (Windows)' || '' }}${{ startsWith( inputs.os, 'macos' ) && ' (macOS)' || '' }}
    # Repositories can point the default Linux legs at a larger runner by setting
    # the `RUNNERS_NAME` repository variable, without having to fork this workflow.
    # Explicit macOS/Windows legs are unaffected.
    runs-on: ${{ inputs.os || vars.RUNNERS_NAME || 'ubuntu-22.04' }}
    continue-on-error: ${{ inputs.php == 'nightly' }}
    timeout-minutes: ${{ inputs.coverage && 30 || 15 }}

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Set up PHP environment
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '${{ inputs.php }}'
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          extensions: zip, fileinfo
          coverage: ${{ inputs.coverage && 'xdebug' || 'none' }}
          tools: composer,cs2pr
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # WP-CLI packages do not commit a lock file, so `composer update` resolves
      # dependencies on every run while the cache key stays pinned to composer.json.
      # Rotating the suffix weekly stops `dev-*` requirements from being served out
      # of an indefinitely stale cache. `%Y-%W` is portable across the GNU, BSD and
      # Git-for-Windows implementations of `date`.
      - name: Determine the weekly Composer cache suffix
        id: composer-cache-suffix
        shell: bash
        run: echo "value=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Install Composer dependencies & cache dependencies
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          custom-cache-suffix: ${{ steps.composer-cache-suffix.outputs.value }}
        env:
          COMPOSER_ROOT_VERSION: dev-${{ github.event.repository.default_branch }}

      # PHPUnit 10+ may fail a test run when the "old" configuration format is used.
      # Luckily, there is a built-in migration tool since PHPUnit 9.3.
      - name: Migrate PHPUnit configuration for PHPUnit 10+
        if: ${{ inputs.php >= 8.2 || inputs.php == 'nightly' }}
        continue-on-error: true
        run: composer phpunit -- --migrate-configuration

      - name: Setup problem matcher to provide annotations for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run PHPUnit with coverage
        if: ${{ inputs.coverage }}
        run: |
          composer phpunit -- --coverage-clover build/logs/unit-coverage.xml

      - name: Run PHPUnit
        if: ${{ ! inputs.coverage }}
        # For example TestBehatTags.php in wp-cli-tests depends on the db type.
        env:
          WP_CLI_TEST_DBTYPE: 'sqlite'
        run: |
          composer phpunit

      - name: Upload code coverage report
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: build/logs
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
