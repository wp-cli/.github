---
name: Issue and PR Triage

'on':
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue/PR number to triage (leave empty to process all)'
        required: false
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read
  # `actions/ai-inference` v3 dropped the GitHub Models provider, so `models:
  # read` no longer buys anything. The Copilot CLI it now shells out to
  # authenticates as the workflow itself, and this is the scope that lets it
  # spend a Copilot request. See the notes on the inference steps below.
  copilot-requests: write

jobs:
  triage-new-item:
    name: Triage New Issue or PR
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Get available labels
        id: get-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const labelNames = labels.data.map(label => label.name);
            return labelNames.join(', ');

      # The Copilot CLI is not preinstalled on GitHub-hosted runners, and
      # `actions/ai-inference` v3 only shells out to it - it never installs it.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Deliberately unpinned, unlike everything else here: authenticating with
      # `GITHUB_TOKEN` instead of a PAT only works on recent CLI releases, so a
      # pin would be a slow trap rather than a safeguard.
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Analyze with AI
        id: ai-triage
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        env:
          # No PAT secret needed: the CLI authenticates as the workflow, and
          # `copilot-requests: write` meters the request to the organization.
          #
          # This job runs on `pull_request_target`, so the prompt below carries
          # pull request text written by anyone who can open one. The action
          # passes no `--allow-tool` flags, so Copilot is denied shell,
          # filesystem and network access and cannot reach this token - it
          # reads the prompt and returns text, exactly as v2 did. Keep it that
          # way: setting `copilot-allow-tools` here would hand a fork's prompt
          # a runner with a write-scoped token on it.
          GITHUB_TOKEN: ${{ github.token }}
          AVAILABLE_LABELS: ${{ steps.get-labels.outputs.result }}
          ITEM_TITLE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.title || github.event.issue.title }}
          ITEM_BODY: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.body || github.event.issue.body }}
          ITEM_TYPE: ${{ github.event_name == 'pull_request_target' && 'pull request' || 'issue' }}
        with:
          prompt: |
            ## Role

            You are an issue and pull request triage assistant. Analyze the current GitHub
            ${{ env.ITEM_TYPE }} and identify the most appropriate existing labels. Work
            only from the input data below; you have no tools available and no
            further information can be provided.

            ## Guidelines

            - Only use labels that are from the list of available labels.
            - You can choose multiple labels to apply.
            - When generating shell commands, you **MUST NOT** use command
              substitution with `$(...)`, `<(...)`, or `>(...)`. This is a
              security measure to prevent unintended command execution.

            ## Input Data

            **Available Labels** (comma-separated):
            ```
            ${{ env.AVAILABLE_LABELS }}
            ```

            **Title**:
            ```
            ${{ env.ITEM_TITLE }}
            ```

            **Body**:
            ```
            ${{ env.ITEM_BODY }}
            ```

            ## Steps

            1. Review the title, body, and available labels
               provided above.

            2. Based on the title and body, classify the ${{ env.ITEM_TYPE }}
               and choose all appropriate labels from the list of available
               labels.

            3. Return only the selected labels as a comma-separated list,
               with no additional text or explanation. For example:
               ```
               label1, label2, label3
               ```

      - name: Apply labels
        if: steps.ai-triage.outputs.response != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AI_RESPONSE: ${{ steps.ai-triage.outputs.response }}
          AVAILABLE_LABELS: ${{ steps.get-labels.outputs.result }}
        with:
          script: |
            const response = process.env.AI_RESPONSE;
            const availableLabelsStr = process.env.AVAILABLE_LABELS;

            if (!response || response.trim() === '') {
              console.log('No labels selected by AI');
              return;
            }

            if (!availableLabelsStr) {
              console.log('No available labels found');
              return;
            }

            // Parse available labels (normalized to lowercase)
            const availableLabels = availableLabelsStr.split(',')
              .map(l => l.trim().toLowerCase())
              .filter(l => l.length > 0);

            // Parse AI suggested labels
            const suggestedLabels = response.replaceAll('```', '').split(',')
              .map(l => l.trim())
              .filter(l => l.length > 0);

            // Partition into valid and invalid in a single pass
            const { validLabels, invalidLabels } = suggestedLabels.reduce(
              (acc, label) => {
                if (availableLabels.includes(label.toLowerCase())) {
                  acc.validLabels.push(label);
                } else {
                  acc.invalidLabels.push(label);
                }
                return acc;
              },
              { validLabels: [], invalidLabels: [] }
            );

            // Log any invalid labels
            if (invalidLabels.length > 0) {
              console.log(
                `Skipping invalid labels: ${invalidLabels.join(', ')}`
              );
            }

            if (validLabels.length > 0) {
              console.log(`Applying labels: ${validLabels.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: validLabels
              });
            } else {
              console.log('No valid labels to apply');
            }

  triage-unlabeled-items:
    name: Triage Unlabeled Issues and PRs
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.issue_number == ''
    runs-on: ubuntu-latest
    # `actions: write` is only needed to dispatch triage runs, which happens
    # here and nowhere else. Scoping it to this job keeps it out of the token
    # handed to `triage-new-item`, which runs on `pull_request_target` and
    # processes pull request content written by anyone who can open a PR.
    permissions:
      actions: write
      issues: read
      contents: read
    steps:
      - name: Find and dispatch triage for unlabeled items
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Get all open issues (includes PRs)
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );

            console.log(`Found ${issues.length} open issues and PRs`);

            // Filter items without labels
            const unlabeledItems = issues.filter(issue =>
              issue.labels.length === 0
            );

            console.log(
              `Found ${unlabeledItems.length} unlabeled items`
            );

            if (unlabeledItems.length === 0) {
              console.log('No unlabeled items to process');
              return;
            }

            // Dispatch triage workflow for each unlabeled item
            for (const item of unlabeledItems) {
              const itemType = item.pull_request ? 'PR' : 'issue';
              console.log(
                `Dispatching triage for ${itemType} #${item.number}: ` +
                `"${item.title}"`
              );

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'issue-triage.yml',
                  ref: context.ref || 'main',
                  inputs: {
                    issue_number: item.number.toString()
                  }
                });
              } catch (error) {
                console.error(
                  `Failed to dispatch triage for ${itemType} #${item.number}: ` +
                  `${error.message}`
                );
              }

              // Add a small delay to avoid rate limiting
              await new Promise(resolve => setTimeout(resolve, 100));
            }

            console.log('Finished dispatching triage workflows');

  triage-single-item:
    name: Triage Single Issue or PR
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Get available labels
        id: get-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const labelNames = labels.data.map(label => label.name);
            return labelNames.join(', ');

      - name: Get item details
        id: get-item
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Try to get as an issue first (works for both issues and PRs)
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const itemType = issue.data.pull_request ? 'pull request' : 'issue';

            return {
              title: issue.data.title,
              body: issue.data.body || '',
              type: itemType
            };

      # The Copilot CLI is not preinstalled on GitHub-hosted runners, and
      # `actions/ai-inference` v3 only shells out to it - it never installs it.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Deliberately unpinned, unlike everything else here: authenticating with
      # `GITHUB_TOKEN` instead of a PAT only works on recent CLI releases, so a
      # pin would be a slow trap rather than a safeguard.
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Analyze with AI
        id: ai-triage
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        env:
          # No PAT secret needed: the CLI authenticates as the workflow, and
          # `copilot-requests: write` meters the request to the organization.
          GITHUB_TOKEN: ${{ github.token }}
          AVAILABLE_LABELS: ${{ steps.get-labels.outputs.result }}
          ITEM_TITLE: ${{ fromJSON(steps.get-item.outputs.result).title }}
          ITEM_BODY: ${{ fromJSON(steps.get-item.outputs.result).body }}
          ITEM_TYPE: ${{ fromJSON(steps.get-item.outputs.result).type }}
        with:
          prompt: |
            ## Role

            You are an issue and pull request triage assistant. Analyze the current GitHub
            ${{ env.ITEM_TYPE }} and identify the most appropriate existing labels. Work
            only from the input data below; you have no tools available and no
            further information can be provided.

            ## Guidelines

            - Only use labels that are from the list of available labels.
            - You can choose multiple labels to apply.
            - When generating shell commands, you **MUST NOT** use command
              substitution with `$(...)`, `<(...)`, or `>(...)`. This is a
              security measure to prevent unintended command execution.

            ## Input Data

            **Available Labels** (comma-separated):
            ```
            ${{ env.AVAILABLE_LABELS }}
            ```

            **Title**:
            ```
            ${{ env.ITEM_TITLE }}
            ```

            **Body**:
            ```
            ${{ env.ITEM_BODY }}
            ```

            ## Steps

            1. Review the title, body, and available labels
               provided above.

            2. Based on the title and body, classify the ${{ env.ITEM_TYPE }}
               and choose all appropriate labels from the list of available
               labels.

            3. Return only the selected labels as a comma-separated list,
               with no additional text or explanation. For example:
               ```
               label1, label2, label3
               ```

      - name: Apply labels
        if: steps.ai-triage.outputs.response != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AI_RESPONSE: ${{ steps.ai-triage.outputs.response }}
          ITEM_NUMBER: ${{ inputs.issue_number }}
          AVAILABLE_LABELS: ${{ steps.get-labels.outputs.result }}
        with:
          script: |
            const response = process.env.AI_RESPONSE;
            const itemNumber = parseInt(process.env.ITEM_NUMBER);
            const availableLabelsStr = process.env.AVAILABLE_LABELS;

            if (!response || response.trim() === '') {
              console.log('No labels selected by AI');
              return;
            }

            if (!availableLabelsStr) {
              console.log('No available labels found');
              return;
            }

            // Parse available labels (normalized to lowercase)
            const availableLabels = availableLabelsStr.split(',')
              .map(l => l.trim().toLowerCase())
              .filter(l => l.length > 0);

            // Parse AI suggested labels
            const suggestedLabels = response.replaceAll('```', '').split(',')
              .map(l => l.trim())
              .filter(l => l.length > 0);

            // Partition into valid and invalid in a single pass
            const { validLabels, invalidLabels } = suggestedLabels.reduce(
              (acc, label) => {
                if (availableLabels.includes(label.toLowerCase())) {
                  acc.validLabels.push(label);
                } else {
                  acc.invalidLabels.push(label);
                }
                return acc;
              },
              { validLabels: [], invalidLabels: [] }
            );

            // Log any invalid labels
            if (invalidLabels.length > 0) {
              console.log(
                `Skipping invalid labels: ${invalidLabels.join(', ')}`
              );
            }

            if (validLabels.length > 0) {
              console.log(`Applying labels: ${validLabels.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                labels: validLabels
              });
            } else {
              console.log('No valid labels to apply');
            }
