name: Code Quality Checks

on:
  workflow_call:
    inputs:
     parallel-lint-excludes:
        description: 'Additional folders for parallel-lint to exclude, separated by newline'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Add problem matcher
        run: |
          curl --fail --silent --show-error -o .github/actionlint-matcher.json https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json
          echo "::add-matcher::.github/actionlint-matcher.json"

      # Pinned by digest rather than `:latest`, so the linter cannot change
      # underneath ~45 repositories without a commit here, and so the image layer
      # can be reused instead of re-resolved on every run.
      - name: Check workflow files
        uses: docker://rhysd/actionlint@sha256:5457037ba91acd225478edac3d4b32e45cf6c10291e0dabbfd2491c63129afe1 # v1.7.11
        with:
          args: -color -shellcheck=

  lint:
    name: Lint PHP files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Check existence of composer.json file
        id: check_composer_file
        run: echo "files_exists=$(test -f composer.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # See the note on the equivalent step in reusable-unit.yml: no lock file is
      # committed, so the cache key must be rotated on a schedule.
      - name: Determine the weekly Composer cache suffix
        id: composer-cache-suffix
        run: echo "value=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Set up PHP environment
        if: steps.check_composer_file.outputs.files_exists == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 'latest'
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          tools: cs2pr
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies & cache dependencies
        if: steps.check_composer_file.outputs.files_exists == 'true'
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          custom-cache-suffix: ${{ steps.composer-cache-suffix.outputs.value }}
        env:
          COMPOSER_ROOT_VERSION: dev-${{ github.event.repository.default_branch }}

      - name: Check existence of vendor/bin/parallel-lint file
        id: check_linter_file
        run: echo "files_exists=$(test -f vendor/bin/parallel-lint && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run Linter
        if: steps.check_linter_file.outputs.files_exists == 'true'
        run: |
          EXCLUDES=("--exclude vendor" "--exclude .git")

          ADDITIONAL_EXCLUDES=${ADDITIONAL_EXCLUDES%$'\n'}
          IFS=$'\n';
          ADDITIONAL_EXCLUDES=($ADDITIONAL_EXCLUDES)

          for i in "${ADDITIONAL_EXCLUDES[@]}"; do
            if [ ! -z "$i" ]; then
              EXCLUDES+=("--exclude $i")
            fi
          done

          unset IFS;

          echo "Providing excludes: ${EXCLUDES[*]}"

          vendor/bin/parallel-lint -j 10 . --show-deprecated ${EXCLUDES[@]} --checkstyle | cs2pr
        env:
          ADDITIONAL_EXCLUDES: ${{ inputs.parallel-lint-excludes }}

  lint-gherkin:
    name: Lint Gherkin Feature files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 'lts/*'

      # `--fail` matters here: without it curl happily writes an error page to the
      # config file and the linter then runs against garbage rules.
      - name: Download lint rules
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/.github/refs/heads/main/.gherkin-lintrc -o "$RUNNER_TEMP/.gherkin-lintrc"

      - name: Run linter
        run: npx --yes gherkin-lint -c "$RUNNER_TEMP/.gherkin-lintrc"

  lint-spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Check existence of config file
        id: check_files
        run: echo "files_exists=$(test -f .typos.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check spelling
        if: steps.check_files.outputs.files_exists == 'true'
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Check existence of composer.json & phpcs.xml.dist files
        id: check_files
        run: echo "files_exists=$([ -f composer.json ] && [ -f phpcs.xml.dist ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # See the note on the equivalent step in reusable-unit.yml: no lock file is
      # committed, so the cache key must be rotated on a schedule.
      - name: Determine the weekly Composer cache suffix
        id: composer-cache-suffix
        run: echo "value=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Set up PHP environment
        if: steps.check_files.outputs.files_exists == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 'latest'
          tools: cs2pr
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies & cache dependencies
        if: steps.check_files.outputs.files_exists == 'true'
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          custom-cache-suffix: ${{ steps.composer-cache-suffix.outputs.value }}
        env:
          COMPOSER_ROOT_VERSION: dev-${{ github.event.repository.default_branch }}

      - name: Check existence of vendor/bin/phpcs file
        id: check_phpcs_binary_file
        run: echo "files_exists=$(test -f vendor/bin/phpcs && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run PHPCS
        if: steps.check_phpcs_binary_file.outputs.files_exists == 'true'
        run: vendor/bin/phpcs -q --report=full --report-checkstyle=/tmp/phpcs-checkstyle-report.xml

      - name: Convert PHPCS report to PR comments
        if: always()
        run: |
          if [ -f /tmp/phpcs-checkstyle-report.xml ]; then
            cs2pr /tmp/phpcs-checkstyle-report.xml
          fi

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Check existence of composer.json file
        id: check_files
        run: echo "files_exists=$(test -f composer.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # See the note on the equivalent step in reusable-unit.yml: no lock file is
      # committed, so the cache key must be rotated on a schedule.
      - name: Determine the weekly Composer cache suffix
        id: composer-cache-suffix
        run: echo "value=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Set up PHP environment
        if: steps.check_files.outputs.files_exists == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 'latest'
          tools: cs2pr
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies & cache dependencies
        if: steps.check_files.outputs.files_exists == 'true'
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          custom-cache-suffix: ${{ steps.composer-cache-suffix.outputs.value }}
        env:
          COMPOSER_ROOT_VERSION: dev-${{ github.event.repository.default_branch }}

      - name: Check existence of vendor/bin/phpstan file
        id: check_phpstan_binary_file
        run: echo "files_exists=$(test -f vendor/bin/phpstan && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run PHPStan
        if: steps.check_phpstan_binary_file.outputs.files_exists == 'true'
        run: composer phpstan
