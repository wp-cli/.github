name: Functional testing
on:
  workflow_call:
    inputs:
      php:
        type: string
        required: true
      wp:
        type: string
        required: true
      dbtype:
        type: string
        required: false
        default: 'mysql'
      mysql:
        type: string
        required: false
        default: ''
      object_cache:
        type: string
        required: false
        default: 'none'
      coverage:
        type: boolean
        required: false
        default: false
      coverage-driver:
        description: 'Code coverage driver, either `pcov` or `xdebug`.'
        type: string
        required: false
        default: 'pcov'
      shard:
        description: 'Share of the scenarios to run, as `<index>/<total>`, for example `2/3`. Empty to run all of them.'
        type: string
        required: false
        default: ''
      parallel:
        description: 'Number of parallel workers on the runner.'
        type: number
        required: false
        default: 4
      os:
        description: 'Runner to use. Defaults to ubuntu-22.04, or the RUNNERS_NAME repository variable when set.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  functional:
    # This name has to stand on its own. The run view labels a nested job with its
    # own name only; the calling job's name is not surfaced at this depth, so
    # anything omitted here is not shown anywhere. The database version is spelled
    # out because "MySQL" alone rendered the mysql-8.0 and mysql-8.4 legs
    # identically.
    name: Behat | PHP ${{ inputs.php }} | WP ${{ inputs.wp }} | ${{ inputs.dbtype == 'sqlite' && 'SQLite' || inputs.mysql || 'MySQL' }}${{ inputs.object_cache == 'sqlite' && ' (Obj Cache)' || '' }}${{ inputs.coverage && format( ' (with coverage{0})', inputs.shard && format( ', {0}', inputs.shard ) || '' ) || '' }}${{ startsWith( inputs.os, 'windows' ) && ' (Windows)' || '' }}${{ startsWith( inputs.os, 'macos' ) && ' (macOS)' || '' }}
    # Repositories with a heavy Behat suite can point the default Linux legs at a
    # larger runner by setting the `RUNNERS_NAME` repository variable, without
    # having to fork this workflow. Explicit macOS/Windows legs are unaffected.
    runs-on: ${{ inputs.os || vars.RUNNERS_NAME || 'ubuntu-22.04' }}

    continue-on-error: ${{ inputs.dbtype == 'mariadb' || inputs.php == 'nightly' || startsWith( inputs.os, 'windows' ) || startsWith( inputs.os, 'macos' ) }}

    timeout-minutes: ${{ ( startsWith( inputs.os, 'windows' ) || startsWith( inputs.os, 'macos' ) ) && 120 || inputs.coverage && 90 || 60 }}

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_TCP_PORT: 3306
      WP_CLI_TEST_DBROOTUSER: root
      WP_CLI_TEST_DBROOTPASS: root
      WP_CLI_TEST_DBNAME: wp_cli_test
      WP_CLI_TEST_DBUSER: wp_cli_test
      WP_CLI_TEST_DBPASS: password1
      WP_CLI_TEST_DBHOST: 127.0.0.1:3306
      WP_CLI_TEST_OBJECT_CACHE: ${{ inputs.object_cache }}

    steps:
      # The Behat suite is heavily I/O- and process-bound: every scenario
      # installs WordPress and spawns many short-lived `wp` processes. On the
      # GitHub Windows runner those working files land on the slow C: drive.
      # Relocating them to the fast D: drive roughly halves the Behat run time.
      # The wp-cli-tests framework derives the WP install dir, all core/install/
      # SQLite caches and HOME/COMPOSER_HOME (the WP-CLI cache) from
      # sys_get_temp_dir(), and forwards TEMP/TMP to the spawned `wp` processes,
      # so pointing TEMP/TMP at D: relocates all of it. Guarded so it is a no-op
      # if the D: drive is ever unavailable.
      - name: Use the fast D drive for temporary files
        if: ${{ startsWith(inputs.os, 'windows') }}
        shell: pwsh
        run: |
          if (Test-Path 'D:\') {
            New-Item -ItemType Directory -Force -Path 'D:\Temp' | Out-Null
            "TEMP=D:\Temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "TMP=D:\Temp"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host 'Using D:\Temp for temporary files.'
          } else {
            Write-Host 'D: drive not available; using the default temp location.'
          }

      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      # MySQL 8.4 requires explicit loading of mysql_native_password plugin
      - name: Determine MySQL authentication configuration
        id: mysql-config
        if: ${{ inputs.dbtype != 'sqlite' && inputs.mysql == 'mysql-8.4' }}
        run: |
          echo "auth-config<<EOF" >> $GITHUB_OUTPUT
          echo "mysql_native_password=ON" >> $GITHUB_OUTPUT
          echo "authentication_policy=mysql_native_password," >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Downloading and starting the database server is the slowest part of the
      # setup, and nothing needs it until the test database is prepared. Run it
      # in the background alongside the PHP and Composer setup below, and wait
      # for it right before it is first used. The action only downloads its own
      # binaries, so it cannot contend with apt, Homebrew or Chocolatey.
      - name: Setup MySQL Server
        id: setup-mysql
        if: ${{ inputs.dbtype != 'sqlite' }}
        background: true
        uses: shogo82148/actions-setup-mysql@fb8ae72ad9f2f8244e594d6d48a981e975aee78e # v1
        with:
          mysql-version: ${{ inputs.mysql }}
          auto-start: true
          root-password: ${{ env.WP_CLI_TEST_DBROOTPASS }}
          user: ${{ env.WP_CLI_TEST_DBUSER}}
          password: ${{ env.WP_CLI_TEST_DBPASS}}
          # Fall back to legacy configuration for MySQL 5.6, 5.7, 8.0 and MariaDB.
          my-cnf: |
            ${{ steps.mysql-config.outputs.auth-config || 'default_authentication_plugin=mysql_native_password' }}
            ${{ inputs.dbtype == 'mariadb' && '[client]' || '' }}
            ${{ inputs.dbtype == 'mariadb' && 'disable-ssl-verify-server-cert' || '' }}

      # Only scenarios tagged `@require-bin-gs` need Ghostscript, for Imagick to
      # render PDFs. The runner images don't ship it, and installing it costs a
      # Linux leg 15-30s, so skip it for packages that have no such scenario.
      - name: Check whether Ghostscript is needed
        id: ghostscript
        shell: bash
        run: |
          if grep -rqs --include='*.feature' '@require-bin-gs' features; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Chocolatey is slow and these packages are only needed by the Behat run
      # itself, so let it install them while PHP and Composer are set up.
      - name: Install dependencies (Windows)
        if: ${{ startsWith(inputs.os, 'windows') }}
        background: true
        run: choco install sqlite ${{ steps.ghostscript.outputs.needed == 'true' && 'ghostscript' || '' }} --yes

      - name: Install Ghostscript
        # Keyed on the actual runner rather than the `os` input: an empty input no
        # longer implies ubuntu-22.04 now that RUNNERS_NAME can select the image.
        if: ${{ runner.os == 'Linux' && steps.ghostscript.outputs.needed == 'true' }}
        timeout-minutes: 10
        run: |
          if command -v gs > /dev/null 2>&1; then
            echo "Ghostscript $(gs --version) is already installed; skipping."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install ghostscript -y

      - name: Install Ghostscript (macOS)
        if: ${{ startsWith(inputs.os, 'macos') && steps.ghostscript.outputs.needed == 'true' }}
        run: |
          if command -v gs > /dev/null 2>&1; then
            echo "Ghostscript $(gs --version) is already installed; skipping."
            exit 0
          fi
          brew install ghostscript

      - name: Set up PHP environment
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '${{ inputs.php }}'
          # PCOV only instruments the files below pcov.directory. Left unset, it would pick the
          # working directory of every `wp` process the scenarios run, which is a temporary
          # WordPress install, and collect nothing. Xdebug instead instruments every file it
          # loads, all of WordPress included, which makes it several times slower.
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On${{ inputs.coverage && inputs.coverage-driver == 'pcov' && format( ', pcov.directory={0}, "pcov.exclude=~/vendor/~"', github.workspace ) || '' }}
          extensions: gd, imagick, mysql, zip, pdo_sqlite, exif, fileinfo
          coverage: ${{ inputs.coverage && inputs.coverage-driver || 'none' }}
          tools: composer
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows runners don't pick up patched PHP builds on their own (shivammathur/setup-php#1139).
          update: ${{ runner.os == 'Windows' }}

      - name: Change ImageMagick policy to allow pdf->png conversion.
        # Keyed on the actual runner rather than the `os` input, and tolerant of
        # images that ship a different ImageMagick layout — `sed -i` on a missing
        # file exits non-zero and would fail the leg.
        if: ${{ runner.os == 'Linux' }}
        run: |
          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            sudo sed -i 's/^.*policy.*coder.*none.*PDF.*//' /etc/ImageMagick-6/policy.xml
          else
            echo 'No ImageMagick 6 policy file found; nothing to relax.'
          fi

      # WP-CLI packages do not commit a lock file, so `composer update` resolves
      # dependencies on every run while the cache key stays pinned to composer.json.
      # Rotating the suffix weekly stops `dev-*` requirements from being served out
      # of an indefinitely stale cache. `%Y-%W` is portable across the GNU, BSD and
      # Git-for-Windows implementations of `date`.
      - name: Determine the weekly Composer cache suffix
        id: composer-cache-suffix
        shell: bash
        run: echo "value=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Install Composer dependencies & cache dependencies
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          custom-cache-suffix: ${{ steps.composer-cache-suffix.outputs.value }}
        env:
          COMPOSER_ROOT_VERSION: dev-${{ github.event.repository.default_branch }}

      # Waits for the database server and the Windows dependencies. `wait-all`
      # rather than `wait: setup-mysql`, as either background step may have been
      # skipped by its condition. A failure in either fails the job here.
      - name: Wait for background setup steps
        wait-all:

      - name: Remove system MySQL binary
        if: ${{ inputs.dbtype != 'sqlite' && !startsWith(inputs.os, 'windows') && !startsWith(inputs.os, 'macos') }}
        run: sudo rm -f /usr/bin/mysql /usr/bin/mysqldump

      - name: Prepare test database
        if: ${{ inputs.dbtype != 'sqlite' }}
        run: composer prepare-tests

      - name: Check Behat environment
        env:
          WP_VERSION: '${{ inputs.wp }}'
          WP_CLI_TEST_DBTYPE: ${{ inputs.dbtype || 'mysql' }}
          WP_CLI_TEST_DBSOCKET: '${{ steps.setup-mysql.outputs.base-dir }}/tmp/mysql.sock'
          WP_CLI_TEST_DEBUG_BEHAT_ENV: 1
        run: composer behat

      - name: Run Behat
        env:
          WP_VERSION: '${{ inputs.wp }}'
          WP_CLI_TEST_DBTYPE: ${{ inputs.dbtype || 'mysql' }}
          WP_CLI_TEST_DBSOCKET: '${{ steps.setup-mysql.outputs.base-dir }}/tmp/mysql.sock'
          WP_CLI_TEST_COVERAGE: ${{ inputs.coverage }}
          BEHAT_ARGS: ${{ format( '{0}', runner.debug && '--format=pretty' ) }}
          # Spread the scenarios over parallel workers, each in its own throwaway containers.
          # Where Docker cannot be used, such as on Windows and macOS or when collecting code
          # coverage, wp-cli/wp-cli-tests falls back on its own. Older versions ignore these.
          WP_CLI_TEST_PARALLEL: ${{ inputs.parallel }}
          # The test framework spreads the scenarios over the shards by their expected cost,
          # the same way on every runner, so that together they run every scenario once.
          WP_CLI_TEST_SHARD: ${{ inputs.shard }}
          WP_CLI_TEST_DOCKER: auto
        run: |
          composer behat -- $BEHAT_ARGS || composer behat-rerun -- $BEHAT_ARGS

      # The calling workflow uploads the reports of all shards together, once all of them
      # finished, so that Codecov receives them as one upload and never reports on a part.
      - name: Name the code coverage report
        id: coverage_artifact
        if: ${{ inputs.coverage }}
        env:
          SHARD: ${{ inputs.shard || 'all' }}
          PHP: ${{ inputs.php }}
          DRIVER: ${{ inputs.coverage-driver }}
          PARALLEL: ${{ inputs.parallel }}
        run: echo "name=behat-coverage-${PHP}-${DRIVER}-p${PARALLEL}-${SHARD//\//-of-}" >> "$GITHUB_OUTPUT"

      - name: Keep the code coverage report for the upload
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.coverage_artifact.outputs.name }}
          path: build/logs/*.xml
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed shard replaces the report of its previous attempt.
          overwrite: true
