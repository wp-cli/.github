name: Testing

on:
  workflow_call:
    inputs:
      minimum-php:
        description: 'Minimum PHP version to test against.'
        type: string
        required: false
        default: '7.2'
      minimum-wp:
        description: 'Minimum WP version to test against.'
        type: string
        required: false
        default: '4.9'
      with-coverage:
        description: 'Include coverages tests.'
        type: boolean
        required: false
        default: true
      matrix:
        description: 'Additional matrix entries to include or exclude.'
        type: string
        required: false
        default: '{ "include": [], "exclude": [] }'

permissions:
  contents: read

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # Keying on the ref lets a new push supersede the run it replaces, for pull
  # requests and branches alike. Keying on the event as well keeps a push to the
  # default branch and the nightly schedule from cancelling each other, since
  # both report the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix computation lives in its own reusable workflow so a caller can
  # invoke it directly and fan out from its own top-level jobs, which is what
  # makes the legs group by PHP version in the run view. See the README.
  prepare:
    uses: ./.github/workflows/reusable-prepare-matrix.yml
    with:
      minimum-php: ${{ inputs.minimum-php }}
      minimum-wp: ${{ inputs.minimum-wp }}
      with-coverage: ${{ inputs.with-coverage }}
      matrix: ${{ inputs.matrix }}

  unit:
    needs: prepare
    if: ${{ needs.prepare.outputs.unit != '' }}
    # Static on purpose. At this nesting depth the run view does not surface this
    # name, so putting distinguishing detail here would hide it; the called
    # workflow carries the full leg name instead.
    name: Unit
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.unit) }}
    uses: ./.github/workflows/reusable-unit.yml
    secrets: inherit
    with:
      php: ${{ matrix.php }}
      coverage: ${{ matrix.coverage == true }}
      os: ${{ matrix.os || '' }}

  functional:
    needs: prepare
    if: ${{ needs.prepare.outputs.functional != '' }}
    # Static on purpose. At this nesting depth the run view does not surface this
    # name, so putting distinguishing detail here would hide it; the called
    # workflow carries the full leg name instead.
    name: Behat
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.functional) }}
    uses: ./.github/workflows/reusable-functional.yml
    secrets: inherit
    with:
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
      dbtype: ${{ matrix.dbtype || 'mysql' }}
      mysql: ${{ matrix.mysql || '' }}
      object_cache: ${{ matrix.object_cache }}
      coverage: ${{ matrix.coverage == true }}
      os: ${{ matrix.os || '' }}
